name: 💡 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前请先确认

        - [ ] 我已搜索过现有 Issue 与 Discussions，未发现相同建议
        - [ ] 该建议**不涉及修改上游代码**（本项目采用「上游零修改」原则，所有适配写在 compat 层）
        - [ ] 该建议**不引入重量级新依赖**（尤其需要联网下载模型或数十 MB 二进制的）

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述场景与痛点，而不是直接给方案
      placeholder: |
        我在手机上编译 C 项目时，每次都要手动执行 mkdir build && cd build && cmake ..，
        希望能一键完成。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的方案
      validations:
        required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现有功能能否绕道实现？其他项目怎么做的？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围（你的判断）
      options:
        - compat 层（runtime/compat/）
        - 打包规则（runtime/build/）
        - Android 壳（android/）
        - 工具链（tools/、Termux 包）
        - 文档
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: 是否会影响 RUNTIME_VERSION
      description: 凡改动 runtime/ 内容即需 +1（会触发老用户重新解压运行时）
      options:
        - "否（纯 UI/文档）"
        - "是（需升级运行时）"
        - "不确定"
    validations:
      required: true

  - type: textarea
    id: willing
    attributes:
      label: 你是否愿意提交 PR
      description: 欢迎任何人贡献；如愿意，请说明你能投入的范围
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考链接、相关 Issue 等
    validations:
      required: false
